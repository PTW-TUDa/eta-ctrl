[setup]
environment_import = "examples.kea_tank.environments.kea_model_env.DrKea"
# --migration-agent-setup-start--
agent_import = "eta_ctrl.agents.MpcAgent"
# --migration-agent-setup-end--

[settings]
sampling_time = 10  # time in seconds
episode_duration = 600  # time in seconds
n_episodes_play = 1
verbose = 2
seed = 123
scenario_time_begin = "2022-03-18 00:00"
scenario_time_end = "2022-03-18 00:30"
# --migration-prediction-horizon-start--
prediction_horizon = 600  # time in seconds, optimization horizon K, is constant
# --migration-prediction-horizon-end--

[[settings.scenario_files]]  # accessible via the scenario_files parameter
path = "electricity_price_test.csv"
interpolation_method = "interpolate"
infer_datetime_cols = "string"
time_conversion_str = "%d.%m.%Y %H:%M"
# Convert electricity cost from   € / MW h   to   €/kW min
scale_factors = {"Electrical_Energy_Price_MWh" = 0.277777}  # 1000/3600
rename_cols = {"Electrical_Energy_Price_MWh" = "energy_price"}

[settings.environment]
sim_steps_per_sample = 1

# --migration-agent-config-start--
[settings.agent]
model_import = "examples.kea_tank.kea_pyomo_model.DrKeaModel"
solver_name = "cplex_direct"
[settings.agent.solver_options]
timelimit = 30

[settings.agent.model_parameters]
p_heat = 10  # kW, heating power consumption
tank_temperature_start = 60  # °C
tank_temperature_min = 55  # °C
tank_temperature_max = 65  # °C
temperature_change_heating = 0.02  # Kelvin per second
temperature_change_cleaning = -0.01  # Kelvin per second
# --migration-agent-config-end--
