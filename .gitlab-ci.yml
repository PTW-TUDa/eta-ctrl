stages:
  - setup
  - check
  - test
  - deploy

workflow:
  rules:
    # Don't create a merge request pipeline for the default branch
    - if:  $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    # Instead, create a branch pipeline for development
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Create merge request pipeline for other branches
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Create a pipeline for tags
    - if: $CI_COMMIT_TAG

.on_version_tag_rule:
  rules:
    # Deploy if a version tag was created
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # Poetry settings
  POETRY_VERSION: 2.3.2
  REGISTRY_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/poetry${POETRY_VERSION}

.cache-config: &cache-config
  key:
    files:
      - poetry.lock
    prefix: "eta-ctrl-deps"
  paths:
    - ${POETRY_CACHE_DIR}
    - ${PIP_CACHE_DIR}

default:
  tags:
    - python
    - docker
  interruptible: true
  image: ${REGISTRY_IMAGE}:py3.11
  before_script:
    - python --version
    - rm -rf dist doc eta_ctrl.egg-info build
    - rm -rf docs/_build docs/_stubs
    - ls -la
    # Install development dependencies
    - poetry sync
  # Cache gets invalidated when poetry.lock changes
  cache:
    <<: *cache-config
    policy: pull



poetry:
  stage: setup
  before_script: []
  script:
    - poetry --version
    - poetry check
    - poetry lock
    - git diff --exit-code poetry.lock

# Job to update pip cache
update-cache:
  stage: setup
  allow_failure: true
  before_script: []
  script:
    # Remove torch and add torch+cpu because nvidia packages (cuda) are not needed
    - poetry remove torch --lock
    - poetry source add --priority explicit pytorch_cpu https://download.pytorch.org/whl/cpu
    - poetry add --source pytorch_cpu torch==2.4.0
    - poetry sync
  cache:
    <<: *cache-config
    policy: pull-push
  artifacts:
    paths:
      - pyproject.toml
      - poetry.lock
  dependencies: []
  needs:
    - job: poetry

ruff:
  stage: check
  script:
    - ruff --version
    - ruff check
    - ruff format --check

codespell:
  stage: check
  script:
    - codespell --version
    - codespell

mypy:
  stage: check
  script:
    - mypy --version
    - mypy --config-file pyproject.toml


secret_detection:
  stage: check
  before_script: []

docs:
  stage: check
  script:
    - cd docs
    - make clean
    - make ci-html

linkcheck-docs:
  stage: check
  script:
    - cd docs
    - make clean
    - make linkcheck
  retry:
    max: 2
    when: script_failure
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      allow_failure: true
    - when: on_success


.test:
  stage: test
  script:
  - pytest
  retry:
    max: 1
    when: script_failure

.coverage:
  extends: .test
  coverage: '/TOTAL.*\s+(\d+%)$/'
  script:
  - pytest --cov --junitxml=./junit.xml --cov-report term --cov-report xml:coverage.xml
  artifacts:
    paths:
      - junit.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# This job has test coverage report
test3.11:
  extends: .coverage

test3.12:
  extends: .test
  image: ${REGISTRY_IMAGE}:py3.12


.deploy:
  stage: deploy
  rules:
    - !reference [.on_version_tag_rule, rules]


deploy-local:
  extends: .deploy
  # Credentials for local repository
  variables:
    PASSWORD: '${CI_JOB_TOKEN}'
    USERNAME: 'gitlab-ci-token'
  script:
    - rm -rf dist build
    - poetry config repositories.eta-fabrik $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi
    - poetry publish --build --username $USERNAME --password $PASSWORD --repository eta-fabrik

# build the sources
deploy-pypi:
  extends: .deploy
  # Credentials for pypi repository
  variables:
    PASSWORD: '${PYPI_UPLOAD_TOKEN}'
    USERNAME: '__token__'
  needs:
    - deploy-local
  script:
    - rm -rf dist
    - poetry publish --build --username $USERNAME --password $PASSWORD
  artifacts:
    name: "eta_ctrl-build-$CI_COMMIT_REF_NAME-$CI_JOB_STATUS"
    paths:
      - dist/
      - eta_ctrl.egg-info/
