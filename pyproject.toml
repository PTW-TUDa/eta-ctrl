[project]
name = "eta-ctrl"
version = "0.2.0"
description = "A modular framework for rolling-horizon operational control using a Gym-compatible agent–environment abstraction. The framework enables integration of optimization-based agents (Pyomo), reinforcement learning agents (Stable-Baselines3), heuristic search methods, and rule-based controllers. Environments can be instantiated from FMI-compliant simulations, mathematical models, or real-world system interfaces."
license = "BSD-2-Clause"
readme = "README.rst"
requires-python = ">=3.11,<3.13"
dynamic = ["classifiers"]
authors = [
    {name = "Technical University of Darmstadt, Institute for Production Management, Technology and Machine Tools (PTW)", email="info@ptw.tu-darmstadt.de"}
]
maintainers = [
  {name = "Andreas Clement", email = "A.Clement@PTW.TU-Darmstadt.de"},
  {name = "Jerome Stock", email = "J.Stock@PTW.TU-Darmstadt.de"},
  {name= "Julius Balzer", email = "julius.balzer@stud.tu-darmstadt.de"}
]
keywords = [
    "rolling horizon control",
    "model predictive control (MPC)",
    "reinforcement learning",
    "optimization-based control",
    "rule-based control",
    "Pyomo",
    "Stable-Baselines3",
    "Gym interface",
    "Functional Mock-up Interface FMI",
    "cyber-physical systems",
    "industrial energy systems",
    "real-time control",
    "simulation and co-simulation",
    "eta factory"]

dependencies = [
    "attrs (>=25.3.0,<27.0.0)",
    "python-dateutil (>=2.9.0,<3.0.0)",
    "numpy (>=2.2.0,<3.0.0)",
    "pandas (>=2.2.3,<3.2.0)",
    "fmpy (>=0.3.26,<0.4.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "tomli-w (>=1.2.0,<2.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "gymnasium (>=1.2.0,<1.4.0)", # no SemVer
    "stable-baselines3 (>=2.7.0,<2.8.0)", # no SemVer
    "tensorboard (>=2.18.0,<3.0.0)",
    "pyomo (>=6.9.2,<6.11.0)",
    "eta-nexus ==0.1.0", # no SemVer, no Python 3.13 support in any release yet
    "pydantic (>=2.12.0,<3.0.0)",
]
optional-dependencies.examples = [
    "matplotlib (>=3.10.0,<3.12.0)",
    "keyboard (>=0.13.5,<0.14.0)",
    "pygame (>=2.6.0,<2.7.0)",
    "pyglet (>=2.1.0,<2.2.0)",
    "onnxruntime (>=1.24.0,<1.25.0)",
    "cplex (>=22.1.2.0,<23.0.0.0)",
]
optional-dependencies.docs = [
    "sphinx (>=8.0.0,<10.0.0)",
    "sphinx-rtd-theme (>=3.0.0,<4.0.0)",
    "sphinx-copybutton (>=0.5.2,<1.0.0)",
    "autodoc-pydantic (>=2.2.0,<3.0.0)",
]
[project.urls]
    Homepage = "https://www.ptw.tu-darmstadt.de"
    Repository = "https://github.com/PTW-TUDa/eta_ctrl/"
    Documentation = "https://eta-ctrl.readthedocs.io/"
    Issues = "https://git.ptw.maschinenbau.tu-darmstadt.de/eta-fabrik/public/eta-ctrl/-/issues"

[project.scripts]
    create-sim-env = "scripts.fmu_cli:create_sim_env"
    export-fmu-data = "scripts.fmu_cli:export_fmu_data"
    export-pyomo-data = "scripts.pyomo_export_cli:export_pyomo_data"

[tool.poetry]
requires-poetry = ">=2.0"
# Classifiers are defined in the poetry section to dynamically add the python version
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
include = [
    {path="examples/", format=["sdist"]}
]

[tool.poetry.group.examples.dependencies]
# Versions defined above to ensure pip compatibility
matplotlib = "*"
keyboard = "*"
pygame = "*"
pyglet = "*"
onnxruntime = "*"
cplex = "*"

[tool.poetry.group.docs.dependencies]
# Versions defined above to ensure pip compatibility
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-copybutton = "*"
autodoc-pydantic = "*"

[tool.poetry.group.dev.dependencies]
# Dev install assumes poetry, so pip compatibility is not needed
# Specific requirements for tests
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-timeout = "^2.4.0"
# Specific requirements for CI tools
pre-commit = "^4.0.0"
ruff = "~0.15.4"
codespell = "^2.4.0"
# MyPy requirements and typing packages
mypy = "~1.19.0"
types-python-dateutil = "^2.9.0"
types-pytz = "^2025.2.0"

[tool.mypy]
python_version = "3.11"
files = ["eta_ctrl", "examples"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unreachable = true
show_column_numbers = true

exclude = [
    "docs/conf.py",
    "^test/",
]

[[tool.mypy.overrides]]
module = [
    "fmpy.*",
    "pandas.*",
    "gymnasium.*",
    "pyomo.*",
    "setuptools",
    "keyboard.*",
    "onnxruntime.*",
    "matplotlib.*",
    "torch.*",
    "tomli_w",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true

[tool.pytest.ini_options]
addopts = ["--cov-config=pyproject.toml", "--color=yes"]
log_cli = true
log_cli_level = 20
log_cli_format = "[%(levelname)s: %(name)s] %(message)s"
testpaths = [
    "test",
]
markers = [
    "disable_logging: Disable logging for the marked test",
]

# Configuration for pytest-cov
[tool.coverage.run]
source = [
    "eta_ctrl",
]
omit = [
    "*/venv/*",
    "*/.venv/*",
    "*/docs/*",
    "*/build/*",
    "*/dist/*",
    "*/eta_ctrl/type_hints/*",
]

[tool.coverage.report]
exclude_lines = [
    # These lines are excluded from coverage because they are not meant to be tested
    'pragma: no cover',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    'pass',
]

[tool.ruff]
line-length = 120
indent-width = 4
required-version = ">=0.15.4"
target-version = "py311"
output-format = "concise"
# Only fix with $ruff check --fix
fix = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", "ANN001",  # Don't use `Any` as type annotation
    "ARG",      # Unused method arguments
    "C901",     # Complex logic
    "D",        # Docstrings
    "DTZ",      # Datetime timezone
    "FBT00",    # Boolean positional arguments
    "G004",     # Logging statement uses f-string
    "PERF203",  # try - except performance overhead in loop
    "PLR2004",  # Pylint: magic values
    "S60",      # Subprocess calls
    "SIM105",   # Force contextlib suppressor
    "TD002", "FIX",  # Ignore TODO authors
    # Recommended to ignore as they conflict with the formatter
    "W191", "E111", "E114", "E117", "D206", "D300", "COM812", "COM819", "ISC001",
]


[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["PLC0414"]
"test/*" = ["RUF012", "S", "ANN", "D", "SIM", "FBT00", "PLR2004", "SLF", "PLC0414"]
"examples/*" = ["S10", "D"]
"scripts/*" = ["INP001"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pylint]
max-args = 14
max-branches = 13
max-statements = 62
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.codespell]
skip = "*.lock, */Manifest.toml, ./docs/_build"
ignore-words-list = ["Temperatur"]
quiet-level = 3

# Esbonio settings (optional, local sphinx server)
[tool.esbonio.sphinx]
buildCommand = ["sphinx-build", "-M", "html", "docs", "docs/_build"]
pythonCommand = ["${venv:.venv}"]  # Assumes local venv is called '.venv'

[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"
