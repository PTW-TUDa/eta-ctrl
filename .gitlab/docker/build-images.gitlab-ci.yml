
build-docker-images:
  # Build dependency images before setup jobs pull ${REGISTRY_IMAGE} after dependency image inputs change.
  stage: image-build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  cache: []

  # Run one Kaniko executor per job container; repeated executor calls in one container are fragile.
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]

  variables:
    DOCKERFILE_PATH: ".gitlab/docker/dockerfile"
    CONTEXT: "$CI_PROJECT_DIR"

  rules:
    # Only run automatically on the default branch when dependency image inputs change.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - poetry.lock
        - pyproject.toml
        - .gitlab/docker/dockerfile
        - .gitlab-ci.yml
    # Or run manually from GitLab UI.
    - when: manual
      allow_failure: true

  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${CI_REGISTRY}": {
            "username": "${CI_REGISTRY_USER}",
            "password": "${CI_REGISTRY_PASSWORD}"
          }
        }
      }
      EOF

  script:
    - IMAGE_NAME="${REGISTRY_IMAGE}:py${PYTHON_VERSION}"
    - echo "Building and pushing ${IMAGE_NAME} with Kaniko..."
    - |
      /kaniko/executor \
        --context "${CONTEXT}" \
        --dockerfile "${CONTEXT}/${DOCKERFILE_PATH}" \
        --destination "${IMAGE_NAME}" \
        --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
        --build-arg "POETRY_VERSION=${POETRY_VERSION}" \
        --cache=true \
        --cache-repo "${REGISTRY_IMAGE}/cache" \
        --cleanup
    - echo "Pushed ${IMAGE_NAME}"
